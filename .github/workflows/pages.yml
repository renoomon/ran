# نشر الموقع على GitHub Pages.
#
# هذا الملف مطلوب فقط لو اخترت مصدر Pages = "GitHub Actions".
# لو اخترت "Deploy from a branch" فـ GitHub ينشر بنفسه عند كل push
# وما تحتاج هذا الـworkflow أبدًا.
#
# ملاحظة: GITHUB_TOKEN ما يقدر ينشئ موقع Pages من الصفر،
# فلازم تفعّل Pages مرة وحدة يدويًا من Settings ← Pages.

name: Deploy CineSearch to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Collect the static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
